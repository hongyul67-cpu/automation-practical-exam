<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<!-- 수업용 「모두 같은 문제」 — ?fix=1 로 열면 문제·보기 순서가 고정됩니다 -->
<script src="https://hongyul67-cpu.github.io/links/fixorder.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>자동화설비기능사 실기 · 공개도면 문제 게임</title>
<style>
  :root{
    --bg:#0E1D2B; --panel:#15293C; --panel2:#102130; --border:#264257;
    --line:#E9EEF3; --amber:#F2A93B; --cyan:#4FD1E8; --green:#57D68D;
    --red:#EA5B62; --text:#EAF1F6; --sub:#8FA8BC;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    background-image:
      linear-gradient(rgba(79,209,232,0.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(79,209,232,0.05) 1px,transparent 1px);
    background-size:24px 24px;
  }
  .wrap{max-width:860px;margin:0 auto;padding:18px 14px 60px}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .brand{font-size:12px;color:var(--cyan);letter-spacing:1px;font-weight:700}
  h1{font-size:20px;margin:2px 0 0}
  .sub{font-size:12px;color:var(--sub)}
  .spacer{flex:1}
  button{font-family:inherit;cursor:pointer}
  .btn{background:var(--panel);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:9px 14px;font-size:14px;font-weight:600;transition:.15s}
  .btn:hover{border-color:var(--cyan)}
  .btn.amber{background:var(--amber);color:#1A1200;border:none}
  .btn.cyan{background:var(--cyan);color:#04222B;border:none}
  .btn.ghost{background:transparent}
  .btn:disabled{opacity:.4;cursor:default}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.cards{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;color:var(--text);
    padding:16px;text-align:left;transition:.15s}
  .card:hover{border-color:var(--amber);transform:translateY(-2px)}
  .card .ic{font-size:26px}
  .card .t{font-size:16px;font-weight:700;margin-top:6px;color:var(--text)}
  .card .d{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.5}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px}
  .hr{height:1px;background:var(--border);margin:14px 0}
  .imgbox{background:#fff;border-radius:8px;padding:6px;position:relative;cursor:zoom-in}
  .imgbox img{width:100%;display:block;border-radius:4px}
  .zoomhint{position:absolute;right:8px;bottom:8px;background:rgba(14,29,43,.82);color:#fff;
    font-size:11px;padding:3px 8px;border-radius:20px;pointer-events:none}
  .q{font-size:16px;font-weight:600;margin:14px 0 10px;line-height:1.5}
  .choices{display:grid;gap:9px}
  .choice{background:var(--panel2);border:2px solid var(--border);border-radius:9px;
    padding:12px 14px;font-size:15px;color:var(--text);text-align:left;transition:.12s}
  .choice:hover{border-color:var(--cyan)}
  .choice.correct{border-color:var(--green);background:rgba(87,214,141,.16)}
  .choice.wrong{border-color:var(--red);background:rgba(234,91,98,.14)}
  .choice.dim{opacity:.5}
  .isoopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
  .isoopt{background:#fff;border:3px solid var(--border);border-radius:10px;padding:4px;transition:.12s}
  .isoopt:hover{border-color:var(--cyan)}
  .isoopt img{width:100%;display:block;height:130px;object-fit:contain}
  .isoopt.correct{border-color:var(--green)}
  .isoopt.wrong{border-color:var(--red)}
  .feedback{margin-top:12px;padding:12px;border-radius:9px;font-size:14px;line-height:1.55;display:none}
  .feedback.show{display:block}
  .feedback.ok{background:rgba(87,214,141,.12);border:1px solid var(--green)}
  .feedback.no{background:rgba(234,91,98,.12);border:1px solid var(--red)}
  .hintbox{margin-top:10px;padding:11px 13px;border-radius:9px;font-size:13.5px;line-height:1.55;
    background:rgba(79,209,232,.1);border:1px solid var(--cyan);color:var(--text);display:none}
  .hintbox.show{display:block}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .pill{font-size:12px;color:var(--sub);background:var(--panel2);border:1px solid var(--border);
    padding:4px 10px;border-radius:20px}
  .numin{background:var(--panel2);border:2px solid var(--border);border-radius:9px;color:var(--text);
    font-size:22px;font-weight:700;padding:10px 14px;width:150px;text-align:center;font-family:ui-monospace,Menlo,monospace}
  .numin:focus{outline:none;border-color:var(--cyan)}
  .unit{font-size:16px;color:var(--sub)}
  .progress{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin:8px 0 0}
  .progress>i{display:block;height:100%;background:var(--amber);transition:.3s}
  .statgrid{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;margin:16px 0}
  .statgrid .n{font-size:28px;font-weight:800}
  .statgrid .l{font-size:12px;color:var(--sub);text-align:center}
  /* 계급표 사다리 */
  .tier-ladder{display:grid;gap:8px}
  .tier-row{display:flex;align-items:center;gap:12px;background:var(--panel2);
    border:1px solid var(--border);border-radius:10px;padding:10px 12px}
  .tier-row.cur{background:rgba(242,169,59,.1);border-color:var(--amber)}
  .tier-ic{font-size:26px;width:34px;text-align:center;flex:none}
  /* 도면별 과제 목록 */
  .tasklist{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:560px){.tasklist{grid-template-columns:1fr}}
  .taskcard{display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel2);
    border:1px solid var(--border);border-radius:10px;padding:8px 10px;transition:.12s;color:var(--text)}
  .taskcard:hover{border-color:var(--amber);transform:translateY(-1px)}
  .taskcard img{width:64px;height:46px;object-fit:contain;background:#fff;border-radius:5px;flex:none}
  .taskcard .tt{min-width:0}
  /* editor */
  .ed-list{display:grid;gap:8px}
  .ed-item{background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;
    display:flex;align-items:center;gap:10px}
  .ed-item .th{width:54px;height:40px;background:#fff;border-radius:5px;object-fit:contain}
  input[type=text],textarea,select{background:var(--panel2);border:1px solid var(--border);border-radius:7px;
    color:var(--text);font-family:inherit;font-size:14px;padding:8px 10px;width:100%}
  textarea{resize:vertical;min-height:38px}
  label{font-size:12px;color:var(--sub);display:block;margin:8px 0 3px}
  .qedit{border:1px solid var(--border);border-radius:9px;padding:10px;margin-top:8px;background:var(--panel2)}
  .tag{font-size:11px;color:var(--amber);font-weight:700}
  .link{color:var(--cyan);font-size:13px;background:none;border:none;padding:0;text-decoration:underline}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--green);color:#04222B;
    padding:10px 18px;border-radius:22px;font-weight:700;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
  .toast.show{opacity:1}
  /* lightbox */
  .lb{position:fixed;inset:0;background:rgba(6,12,20,.94);z-index:80;display:none;
    flex-direction:column}
  .lb.show{display:flex}
  .lb .bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;color:#fff}
  .lb .canvas{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center}
  .lb img{max-width:none}
  .mono{font-family:ui-monospace,Menlo,monospace}
  .warn{font-size:12px;color:var(--amber);background:rgba(242,169,59,.1);border:1px solid var(--amber);
    border-radius:8px;padding:8px 10px;margin-top:10px;line-height:1.5}
  a.plain{color:var(--cyan)}

/* ══════════════════════════════════════════════════════════════
   수업 슬라이드(전자칠판) — 예전 board.html 이 index 안으로 들어온 것.
   원래는 그 파일 하나가 페이지 전체였으므로 화면을 통째로 덮는 층으로 만들고
   규칙을 전부 #boardwrap 안으로 가뒀다 (index 와 .top · .bar 가 겹친다).
   ══════════════════════════════════════════════════════════════ */
#boardwrap{position:fixed;inset:0;z-index:99000;display:flex;flex-direction:column}
#boardwrap.hide{display:none!important}

  #boardwrap{
    --bg:#0c1017; --panel:#161c27; --panel2:#1e2634; --line:#2c3648;
    --ink:#e9eefa; --dim:#98a5bd; --accent:#5b8cff; --good:#3ad995; --gold:#ffd166;
    /* 화면 크기에 맞춰 글자가 같이 커진다 — 교실 뒤에서도 읽히게.
       가로뿐 아니라 세로(vh)도 함께 본다. 넓지만 낮은 창에서 글이 넘치지 않게. */
    --h:clamp(22px,min(3.6vw,6.2vh),52px);
    --p:clamp(14px,min(1.9vw,3.3vh),29px);
    --s:clamp(11px,min(1.1vw,1.9vh),17px);
  }
  #boardwrap *{box-sizing:border-box}
  #boardwrap, #boardwrap{height:100%}
  #boardwrap{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:"Pretendard","Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.5;
    -webkit-text-size-adjust:100%}

  #boardwrap #deck{position:fixed;inset:0;display:flex;flex-direction:column}

  /* 상단 바 */
#boardwrap .top{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--line);
    background:rgba(10,14,20,.92);flex:none}
  #boardwrap .sect{font-size:var(--s);color:var(--accent);font-weight:800;letter-spacing:.5px;white-space:nowrap}
  #boardwrap .top .sp{flex:1}
  #boardwrap .pos{font-size:var(--s);color:var(--dim);font-variant-numeric:tabular-nums}
  #boardwrap .top select, #boardwrap .top a{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:5px 9px;font-size:var(--s);font-family:inherit;max-width:34vw;text-decoration:none}
  #boardwrap .bar{height:3px;background:var(--panel2);flex:none}
  #boardwrap .bar>i{display:block;height:100%;background:var(--accent);transition:width .25s}

  /* 본문 — 한 화면에 들어가야 하므로 넘치면 줄어들게만 한다 */
/* 아래쪽 여백을 조금 더 두는 이유: 공용 backbar 단추가 왼쪽 아래에 떠 있어서
     내용이 거기까지 내려오면 글자를 가린다 */
#boardwrap .body{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
    padding:min(3vh,26px) 3vw calc(min(3vh,26px) + 34px)}
  #boardwrap .slide{width:100%;max-width:1400px;display:flex;flex-direction:column;gap:min(2.2vh,18px)}
  #boardwrap h2{font-size:var(--h);font-weight:900;margin:0;letter-spacing:-.02em;line-height:1.2}
  #boardwrap .lead{font-size:var(--p);color:var(--accent);font-weight:800;margin:0}

  /* 그림 + 요점 2단 (좁으면 세로로) */
#boardwrap .two{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:min(3vw,30px);
    align-items:center;min-height:0}
  #boardwrap .fig{background:#fff;border-radius:12px;padding:8px;display:flex;align-items:center;justify-content:center;min-height:0}
  #boardwrap .fig img{max-width:100%;max-height:52vh;object-fit:contain;display:block}
  /* 세로 화면(태블릿·폰)에서는 그림과 글이 위아래로 쌓이므로 그림 높이를 줄인다 */
@media (max-aspect-ratio:1/1){ #boardwrap .two{grid-template-columns:1fr} #boardwrap .fig img{max-height:28vh}}
  #boardwrap .cap{color:var(--dim);font-size:var(--s);text-align:center;margin:6px 0 0}

  #boardwrap ul.pts{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:min(1.4vh,11px)}
  #boardwrap ul.pts li{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);
    border-radius:10px;padding:min(1.6vh,14px) min(1.6vw,18px);font-size:var(--p)}
  #boardwrap ul.pts.solo li{padding:min(2.2vh,20px) min(2vw,24px)}

  /* 표기 카드 */
#boardwrap .syms{display:grid;gap:min(1.6vh,14px);grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
  #boardwrap .sym{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:min(2vh,18px) min(1.8vw,20px);display:flex;flex-direction:column;gap:6px}
  #boardwrap .sym .k{font-size:clamp(18px,min(2.9vw,5vh),42px);font-weight:900;color:var(--gold);
    font-family:ui-monospace,Consolas,Menlo,monospace;line-height:1.15}
  #boardwrap .sym .d{font-size:var(--p);color:var(--ink)}

  /* 체크리스트 */
#boardwrap ol.check{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:min(1.5vh,12px)}
  #boardwrap ol.check li{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:min(1.8vh,15px) min(1.8vw,18px);font-size:var(--p);display:flex;gap:12px;align-items:flex-start}
  #boardwrap ol.check li::before{content:"☐";color:var(--good);font-weight:900;flex:none}

  /* 확인 문제 — 보기 4개 + 해설까지 한 화면에 들어가야 해서 제목을 조금 작게 잡는다 */
#boardwrap .qhead{font-size:clamp(18px,min(2.6vw,4.5vh),38px);font-weight:900;margin:0;line-height:1.25}
  #boardwrap .opts{display:flex;flex-direction:column;gap:min(1.4vh,11px);margin:0;padding:0;list-style:none;counter-reset:o}
  #boardwrap .opts li{counter-increment:o;background:var(--panel);border:2px solid var(--line);border-radius:11px;
    padding:min(1.7vh,15px) min(1.8vw,18px);font-size:var(--p);display:flex;gap:12px;cursor:pointer}
  #boardwrap .opts li::before{content:counter(o);flex:none;width:1.7em;height:1.7em;border-radius:50%;
    background:var(--panel2);color:var(--dim);display:grid;place-items:center;font-weight:800;font-size:.8em}
  #boardwrap .opts li:hover{border-color:var(--accent)}
  #boardwrap .opts.done li{cursor:default}
  #boardwrap .opts li.on{border-color:var(--good);background:rgba(58,217,149,.12)}
  #boardwrap .opts li.on::before{content:"✔";background:var(--good);color:#04222B}
  #boardwrap .opts.done li:not(.on){opacity:.5}
  #boardwrap .exp{background:rgba(58,217,149,.1);border:1px solid var(--good);border-radius:11px;
    padding:min(1.8vh,15px) min(1.8vw,18px);font-size:var(--p)}

  /* 하단 이동 */
#boardwrap .nav{display:flex;gap:10px;padding:10px 16px;border-top:1px solid var(--line);
    background:rgba(10,14,20,.92);flex:none}
  #boardwrap .nav button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;
    padding:min(1.6vh,14px);font-size:clamp(13px,min(1.4vw,2.4vh),20px);font-weight:800;cursor:pointer;font-family:inherit}
  #boardwrap .nav .prev{width:22%}
  #boardwrap .nav .next{flex:1;background:linear-gradient(135deg,#3b82f6,#5b8cff);border-color:transparent;color:#fff}
  #boardwrap .nav button:disabled{opacity:.35;cursor:default}
  #boardwrap .hintkey{font-size:var(--s);color:var(--dim);align-self:center;padding:0 4px;white-space:nowrap}
  @media (max-width:640px){ #boardwrap .hintkey{display:none}}

  /* 예전에는 여기서 공용 backbar.js 단추를 위로 밀어 올렸다(--navh).
     이제는 슬라이드가 열려 있는 동안 떠 있는 위젯을 아예 가린다 —
     board.js·board-pro.js 와 같은 방식이라 자리를 다툴 일이 없다. */
body.bd33-open #bb-btn,
body.bd33-open .tr-btn,
body.bd33-open .cm-launch,
body.bd33-open #rk-badge{visibility:hidden!important;pointer-events:none!important}
body.bd33-open{overflow:hidden}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<div class="lb" id="lb">
  <div class="bar">
    <span class="sub" id="lbcap">도면</span>
    <div class="row">
      <button class="btn ghost" style="color:#fff" onclick="lbZoom(-1)">－</button>
      <button class="btn ghost" style="color:#fff" onclick="lbZoom(1)">＋</button>
      <button class="btn amber" onclick="closeLB()">닫기 ✕</button>
    </div>
  </div>
  <div class="canvas" id="lbcanvas"><img id="lbimg" src="" alt="" /></div>
</div>

<script src="data.js?v=20260826"></script>
<!-- 결과 수집 위젯: 교사가 공유링크에 ?rc=<Apps Script exec URL> 를 붙이면 제출 활성화 -->
<script src="https://hongyul67-cpu.github.io/links/collector.js"
        data-tool="자동화설비 실기 도면게임"></script>
<!-- 계급·랭크포인트 위젯(도구별 RP 누적) -->
<script src="https://hongyul67-cpu.github.io/links/rank.js" data-tool="자동화설비실기도면" data-pace="class"></script>
<!-- 수업 모드(🎓/F9/?class=1): 해설은 .feedback에 뜨므로 알려줌 -->
<script>window.CLASSMODE={root:".wrap",choices:".choice",explain:".feedback"};</script>
<script src="https://hongyul67-cpu.github.io/links/class-mode.js"></script>
<script>
/* 결과제출 기본 도구명(모드별 탭 구분용 베이스) */
const RC_BASE=(window.ResultCollector&&ResultCollector.config&&ResultCollector.config.tool)||"자동화설비 실기 도면게임";
/* ---------------- data layer ---------------- */
const LS_KEY="apx_data_v1";
const IMG=id=>`images/${id}.png`;
const ISO=id=>`images/iso/${id}.png`;
const VIEWS=id=>`images/views/${id}.png`;

function loadData(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){const d=JSON.parse(raw); if(Array.isArray(d)&&d.length)return d;}
  }catch(e){}
  return JSON.parse(JSON.stringify(window.DEFAULT_DRAWINGS));
}
function saveData(d){ localStorage.setItem(LS_KEY,JSON.stringify(d)); }
function resetData(){ localStorage.removeItem(LS_KEY); }
let DATA=loadData();

/* ---------------- helpers ---------------- */
const $=id=>document.getElementById(id);
const app=$("app");
const rint=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=rint(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1600);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* quiz pool = every quiz across drawings ; dims pool = every dim */
function quizPool(){const p=[];DATA.forEach(d=>(d.quiz||[]).forEach((q,i)=>p.push({...q,did:d.id,dname:d.name})));return p;}
function dimPool(){const p=[];DATA.forEach(d=>(d.dims||[]).forEach((q,i)=>p.push({...q,did:d.id,dname:d.name})));return p;}

/* ---------------- lightbox ---------------- */
let lbScale=1;
function openLB(src,cap){lbScale=1;$("lbimg").src=src;$("lbimg").style.width="auto";$("lbcap").textContent=cap||"도면";$("lb").classList.add("show");}
function closeLB(){$("lb").classList.remove("show");}
function lbZoom(dir){lbScale=Math.max(.4,Math.min(4,lbScale+dir*0.3));const im=$("lbimg");im.style.width=(im.naturalWidth*lbScale)+"px";}
$("lb").addEventListener("click",e=>{if(e.target.id==="lb"||e.target.id==="lbcanvas")closeLB();});

/* ---------------- routing ---------------- */
function go(view,arg){window.scrollTo(0,0);({home:renderHome,quiz:renderQuiz,match:renderMatch,dim:renderDim,task:renderTaskList,rank:renderRank,edit:renderEditor,editOne:renderEditOne}[view]||renderHome)(arg);}

function header(title,sub){
  return `<div class="top">

/* ---------------- MODE 1 : QUIZ ---------------- */
let qState=null, sessStart=0;
function renderQuiz(){
  const pool=shuffle(quizPool());
  if(!pool.length){app.innerHTML=header("도면 해독 퀴즈")+`<div class="panel">등록된 문제가 없습니다. 편집 화면에서 추가하세요.</div>`;return;}
  qState={pool,i:0,correct:0,answered:false}; sessStart=Date.now();
  bumpTry("도면해독");
  drawQuiz();
}
function drawQuiz(){
  const s=qState, q=s.pool[s.i];
  app.innerHTML=header("① 도면 해독 퀴즈",`도면 ${q.did} · ${q.dname}`)+`
  <div class="panel">
    <div class="imgbox" onclick="openLB('${IMG(q.did)}','${esc(q.did+" "+q.dname)}')">
      <img src="${IMG(q.did)}" alt="도면 ${q.did}"><span class="zoomhint">🔍 눌러서 확대</span>
    </div>
    <div class="q">${esc(q.q)}</div>
    <div class="choices" id="choices">
      ${choiceOrder(q).map(i=>`<button class="choice" data-i="${i}" onclick="answerQuiz(${i})">${esc(q.choices[i])}</button>`).join("")}
    </div>
    <div class="feedback" id="fb"></div>
    <div class="row" style="margin-top:14px">
      <span class="pill">${s.i+1} / ${s.pool.length}</span>
      <span class="pill">맞힘 ${s.correct}</span>
      <div class="spacer"></div>
      <button class="btn amber" id="nextb" style="display:none" onclick="nextQuiz()">다음 →</button>
    </div>
    <div class="progress"><i style="width:${(s.i)/s.pool.length*100}%"></i></div>
  </div>`;
}
/* 보기 순서를 섞되(정답이 늘 같은 자리에 오지 않게) 문항당 한 번 정해 재렌더에도 유지 */
function choiceOrder(q){ if(!q._order) q._order=shuffle(q.choices.map((_,i)=>i)); return q._order; }
function answerQuiz(i){
  const s=qState; if(s.answered)return; s.answered=true;
  const q=s.pool[s.i], ok=i===q.answer;
  if(ok)s.correct++;
  document.querySelectorAll("#choices .choice").forEach(b=>{
    const bi=+b.dataset.i;
    if(bi===q.answer)b.classList.add("correct");
    else if(bi===i)b.classList.add("wrong");
    else b.classList.add("dim");
    b.style.pointerEvents="none";
  });
  const fb=$("fb");
  fb.className="feedback show "+(ok?"ok":"no");
  fb.innerHTML=(ok?"✅ 정답! ":"❌ 오답. 정답: <b>"+esc(q.choices[q.answer])+"</b><br>")+esc(q.explain||"");
  $("nextb").style.display="";
}
function nextQuiz(){
  const s=qState; s.i++; s.answered=false;
  if(s.i>=s.pool.length){finishSession("① 도면 해독 퀴즈",s.correct,s.pool.length,"quiz");return;}
  drawQuiz();
}

/* ---------------- MODE 3 : MATCH ---------------- */
let mState=null;
function renderMatch(){
  if(DATA.length<4){app.innerHTML=header("3면도 ↔ 3D 매칭")+`<div class="panel">매칭에는 도면이 4장 이상 필요합니다.</div>`;return;}
  mState={order:shuffle(DATA.map(d=>d.id)),i:0,correct:0,answered:false}; sessStart=Date.now();
  bumpTry("3D매칭");
  drawMatch();
}
function drawMatch(){
  const s=mState, id=s.order[s.i], d=DATA.find(x=>x.id===id);
  const others=shuffle(DATA.filter(x=>x.id!==id)).slice(0,3).map(x=>x.id);
  const opts=shuffle([id,...others]);
  s.correctId=id; s.opts=opts;
  app.innerHTML=header("② 3면도 ↔ 3D 매칭",`이 도면(3면도)에 맞는 3D 형상은?`)+`
  <div class="panel">
    <div class="imgbox" onclick="openLB('${VIEWS(id)}','${esc(id+" 3면도")}')">
      <img src="${VIEWS(id)}" alt="3면도"><span class="zoomhint">🔍 눌러서 확대</span>
    </div>
    <div class="q">위 3면도와 일치하는 등각투상(3D) 형상을 고르세요.</div>
    <div class="isoopts" id="isoopts">
      ${opts.map(oid=>`<button class="isoopt" data-id="${oid}" onclick="answerMatch('${oid}')">
        <img src="${ISO(oid)}" alt="3D"></button>`).join("")}
    </div>
    <div class="feedback" id="fb"></div>
    <div class="row" style="margin-top:14px">
      <span class="pill">${s.i+1} / ${s.order.length}</span>
      <span class="pill">맞힘 ${s.correct}</span>
      <div class="spacer"></div>
      <button class="btn amber" id="nextb" style="display:none" onclick="nextMatch()">다음 →</button>
    </div>
    <div class="progress"><i style="width:${(s.i)/s.order.length*100}%"></i></div>
  </div>`;
}
function answerMatch(oid){
  const s=mState; if(s.answered)return; s.answered=true;
  const ok=oid===s.correctId; if(ok)s.correct++;
  document.querySelectorAll("#isoopts .isoopt").forEach(b=>{
    if(b.dataset.id===s.correctId)b.classList.add("correct");
    else if(b.dataset.id===oid)b.classList.add("wrong");
    b.style.pointerEvents="none";
  });
  const d=DATA.find(x=>x.id===s.correctId);
  const fb=$("fb");fb.className="feedback show "+(ok?"ok":"no");
  fb.innerHTML=(ok?"✅ 정답! ":"❌ 오답. ")+`정답은 <b>도면 ${esc(d.id)} · ${esc(d.name)}</b> 입니다.`;
  $("nextb").style.display="";
}
function nextMatch(){
  const s=mState;s.i++;s.answered=false;
  if(s.i>=s.order.length){finishSession("② 3면도 ↔ 3D 매칭",s.correct,s.order.length,"match");return;}
  drawMatch();
}

/* ---------------- MODE 3 : DIMENSION ---------------- */
/* 채점은 '한 번'만 — 맞을 때까지 다시 넣는 방식은 모두가 100점이 되어 배움이 안 된다.
   힌트는 '어디를 보라'만 알려주고 숫자는 절대 말하지 않는다(정답은 채점 뒤에만 공개). */
let dState=null;
function renderDim(){
  const pool=shuffle(dimPool());
  if(!pool.length){app.innerHTML=header("모델링 치수 찾기")+`<div class="panel">등록된 치수 문제가 없습니다.</div>`;return;}
  dState={pool,i:0,correct:0,answered:false,hinted:false,hintUsed:0}; sessStart=Date.now();
  bumpTry("치수찾기");
  drawDim();
}
/* 치수 문제 한 문항의 입력·버튼 영역 (연습 모드와 도면별 과제에서 같이 쓴다) */
function dimInputHTML(q,fn){
  /* 도면에 그대로 적혀 있지 않은 값은 미리 알려 준다 — 없는 숫자를 찾다가 포기하지 않게 */
  const badge = q.calc ? `<div class="row" style="margin-bottom:6px"><b class="tag">🧮 계산해서 구하기</b>
      <span class="sub" style="font-size:11.5px">도면에 적힌 값들로 계산해야 나오는 치수입니다.</span></div>` : "";
  return badge + `<div class="q">${esc(q.ask)}</div>
    <div class="row">
      <input class="numin mono" id="numin" type="number" inputmode="decimal" placeholder="?" autocomplete="off"
        onkeydown="if(event.key==='Enter')${fn}Check()">
      <span class="unit">${esc(q.unit||"mm")}</span>
      <button class="btn cyan" id="chk" onclick="${fn}Check()">확인 (한 번만)</button>
      <button class="btn ghost" id="hintb" onclick="${fn}Hint()">💡 어디를 볼까?</button>
      <button class="link" id="giveb" onclick="${fn}GiveUp()">모르겠어요</button>
    </div>
    <div class="hintbox" id="hb"></div>`;
}
/* 채점 결과 표시 — 정답이든 오답이든 여기서 끝내고 다음으로 넘어간다 */
function dimGrade(q,v,gaveUp){
  /* 계산해서 구하는 문항은 나눗셈이 들어가 소수가 되기도 한다.
     tol 이 있으면 그만큼 어긋나도 맞은 것으로 본다(없으면 예전처럼 정확히 일치). */
  const tol = (q.tol!=null) ? Math.abs(q.tol) : 1e-6;
  const ok = !gaveUp && Math.abs(v-q.answer) <= tol + 1e-9;
  const fb=$("fb"); fb.className="feedback show "+(ok?"ok":"no");
  const mine = gaveUp ? "" : `<div class="sub" style="margin-top:6px">내가 쓴 값: <b class="mono">${v}${esc(q.unit||"mm")}</b></div>`;
  fb.innerHTML = (ok ? `✅ 정답! <b class="mono">${q.answer}${esc(q.unit||"mm")}</b>`
                     : `❌ 정답은 <b class="mono">${q.answer}${esc(q.unit||"mm")}</b> 입니다.`)
    + (q.why?`<div style="margin-top:6px">${esc(q.why)}</div>`:"")
    + (ok?"":mine);
  ["chk","hintb","giveb"].forEach(id=>{const b=$(id); if(b){b.disabled=true;b.style.display=id==="chk"?"":"none";}});
  if($("numin"))$("numin").disabled=true;
  if($("nextb"))$("nextb").style.display="";
  return ok;
}
function dimShowHint(q){
  const hb=$("hb"); if(!hb)return;
  hb.className="hintbox show";
  hb.innerHTML="💡 "+esc(q.hint||"도면의 치수선을 다시 확인하세요.")+
    `<div class="sub" style="margin-top:4px;font-size:11.5px">${q.calc
      ? "힌트는 <b>어떤 값을 어떻게</b> 쓸지만 알려 줘요. 숫자는 직접 읽고 계산해야 합니다."
      : "힌트는 위치만 알려 줘요. 숫자는 직접 읽어야 합니다."}</div>`;
  const b=$("hintb"); if(b)b.style.display="none";
}
function drawDim(){
  const s=dState,q=s.pool[s.i];
  app.innerHTML=header("③ 모델링 치수 찾기",`도면 ${q.did} · ${q.dname}`)+`
  <div class="panel">
    <div class="imgbox" onclick="openLB('${IMG(q.did)}','${esc(q.did+" "+q.dname)}')">
      <img src="${IMG(q.did)}" alt="도면 ${q.did}"><span class="zoomhint">🔍 눌러서 확대</span>
    </div>
    ${dimInputHTML(q,"dim")}
    <div class="feedback" id="fb"></div>
    <div class="row" style="margin-top:14px">
      <span class="pill">${s.i+1} / ${s.pool.length}</span>
      <span class="pill">맞힘 ${s.correct}</span>
      <div class="spacer"></div>
      <button class="btn amber" id="nextb" style="display:none" onclick="nextDim()">${s.i+1>=s.pool.length?"결과 보기 →":"다음 →"}</button>
    </div>
    <div class="progress"><i style="width:${(s.i)/s.pool.length*100}%"></i></div>
  </div>`;
  setTimeout(()=>$("numin")&&$("numin").focus(),50);
}
function dimHint(){const s=dState; if(s.answered)return; if(!s.hinted){s.hinted=true;s.hintUsed++;} dimShowHint(s.pool[s.i]);}
function dimCheck(){
  const s=dState; if(s.answered)return;
  const v=parseFloat($("numin").value);
  if(isNaN(v)){toast("숫자를 먼저 입력하세요");return;}
  s.answered=true;
  if(dimGrade(s.pool[s.i],v,false))s.correct++;
}
function dimGiveUp(){
  const s=dState; if(s.answered)return;
  s.answered=true; dimGrade(s.pool[s.i],null,true);
}
function nextDim(){const s=dState;s.i++;s.answered=false;s.hinted=false;
  if(s.i>=s.pool.length){finishSession("③ 모델링 치수 찾기",s.correct,s.pool.length,"dim");return;}
  drawDim();}

/* ---------------- session result ---------------- */
const MODE_LABEL={quiz:"도면해독", match:"3D매칭", dim:"치수찾기"};
function rcReady(){return !!(window.ResultCollector&&ResultCollector.config&&ResultCollector.config.endpoint);}
/* ---- 계급·랭크포인트(rank.js) ---- */
function hasRank(){return typeof Rank!=="undefined"&&Rank&&typeof Rank.award==="function";}
function awardRP(pct,mode){ if(!hasRank())return null; try{return Rank.award(pct,{mode:mode});}catch(e){return null;} }
function rpBox(res){ if(!res||!hasRank())return ""; try{return Rank.resultBox(res);}catch(e){return "";} }
function rankDetail(){ if(!hasRank())return ""; try{const g=Rank.get();return ((g.tier&&g.tier.full)||"")+" · "+(g.rp||0)+"RP";}catch(e){return "";} }
function rankTier(){ try{return (window.Rank&&Rank.get().tier.full)||undefined;}catch(e){return undefined;} }
/* 활동별 도전 횟수(생기부 키워드용) — 활동 시작 때 bumpTry, 제출 때 getTry */
function bumpTry(m){const K="apx_try_v1";let d={};try{d=JSON.parse(localStorage.getItem(K))||{};}catch(e){}d[m]=(d[m]||0)+1;try{localStorage.setItem(K,JSON.stringify(d));}catch(e){}return d[m];}
function getTry(m){const K="apx_try_v1";let d={};try{d=JSON.parse(localStorage.getItem(K))||{};}catch(e){}return d[m]||1;}
/* 제출 — collector.js가 mode(활동명)·retry(도전횟수)·tier(계급)로 생기부(세특) 키워드를 자동 생성 */
function openSubmit(suffix,correct,total,dur,extra){
  if(!window.ResultCollector){toast("제출 위젯을 불러오지 못했어요");return;}
  if(!rcReady()){
      alert(['이 링크로는 제출이 되지 않아요.','',
        '선생님이 나눠 준 제출용 링크(주소 뒤에 ?rc=... 가 붙은 링크)로',
        '들어와야 반·번호를 입력하고 결과를 보낼 수 있습니다.','',
        '연습은 지금 이대로 계속 하셔도 됩니다.'].join(String.fromCharCode(10)));
    return;
  }
  /* 시트 탭은 하나로 — 파트는 mode 로 (규약 §1 ①) */
  ResultCollector.config.tool=RC_BASE;
  ResultCollector.open(Object.assign({
    score:Math.round(correct/total*100), correct, total, durationSec:dur,
    mode:suffix, retry:getTry(suffix), tier:rankTier(), detail:rankDetail()
  },extra||{}));
}
function submitResult(mode,correct,total,dur){ openSubmit(MODE_LABEL[mode]||mode,correct,total,dur); }
function finishSession(title,correct,total,again){
  const pct=Math.round(correct/total*100);
  const dur=sessStart?Math.round((Date.now()-sessStart)/1000):0;
  const mm=String(Math.floor(dur/60)).padStart(2,"0"), ss=String(dur%60).padStart(2,"0");
  const msg=pct>=90?"완벽해요! 🏆":pct>=70?"잘했어요! 👍":pct>=50?"조금만 더! 💪":"복습이 필요해요 📚";
  const rp=awardRP(pct, MODE_LABEL[again]||again);
  /* 제출 버튼은 ?rc= 링크가 아니어도 항상 보인다 (규약 §1 ③) */
  const submitBtn=`<button class="btn amber" onclick="submitResult('${again}',${correct},${total},${dur})">📤 선생님께 결과 제출</button>`;
  app.innerHTML=header(title,"결과")+`
  <div class="panel" style="text-align:center">
    <div style="font-size:20px;font-weight:800;margin:6px 0 2px">${msg}</div>
    <div class="statgrid">
      <div><div class="n" style="color:var(--amber)">${pct}%</div><div class="l">정답률</div></div>
      <div><div class="n" style="color:var(--cyan)">${correct}/${total}</div><div class="l">맞힌 개수</div></div>
      <div><div class="n">${mm}:${ss}</div><div class="l">걸린 시간</div></div>
    </div>
    ${rpBox(rp)}
    <div class="row" style="justify-content:center">
      ${submitBtn}
      <button class="btn cyan" onclick="go('${again}')">다시 풀기</button>
      <button class="btn" onclick="go('home')">홈으로</button>
    </div>
    ${rcReady()?`<div class="sub" style="margin-top:12px;font-size:12px">🧑‍🏫 제출하면 활동·성취·반복·계급을 바탕으로 한 <b>생기부(세특) 키워드</b>가 자동으로 함께 기록돼요.</div>`
              :`<div class="sub" style="margin-top:12px;font-size:12px">※ 선생님이 나눠준 <b>제출용 링크</b>로 열면 ‘결과 제출’ 버튼이 나타나요.</div>`}
  </div>`;
}

/* ---------------- 계급표(랭크 사다리) ---------------- */
function renderRank(){
  if(!hasRank()){app.innerHTML=header("🏆 계급표")+`<div class="panel">랭크 위젯을 불러오지 못했어요. 인터넷 연결을 확인하세요.</div>`;return;}
  const g=Rank.get();
  const rows=Rank.tiers.slice().reverse().map(t=>{     // 마스터가 위로
    const achieved=g.rp>=t.min, isCur=g.tier&&g.tier.key===t.key, need=Math.max(0,t.min-g.rp);
    return `<div class="tier-row${isCur?' cur':''}" style="border-left:5px solid ${t.c}">
      <div class="tier-ic">${t.icon}</div>
      <div style="flex:1;min-width:0">

    </div>`;
  }).join("");
  const H=Rank.history()||[];

    </div>`).join("") || '<div class="sub" style="padding:6px 0">아직 기록이 없어요. 문제를 풀면 RP가 쌓여요.</div>';
  app.innerHTML=header("🏆 계급표","풀수록 RP가 쌓여 계급이 올라가요")+`
  <div class="panel">

      <div><div class="n">${g.plays||0}</div><div class="l">푼 횟수</div></div>

}

/* ---------------- MODE 5 : 도면별 과제(제출) ---------------- */
let pState=null;
function renderTaskList(){
  app.innerHTML=header("④ 도면별 과제","풀 도면(과제)을 선택하세요")+`
  <div class="panel">
    <div class="sub" style="margin-bottom:10px">도면 하나를 고르면 그 도면의 <b>해독 문제 + 치수 문제</b>를 순서대로 풀고, 끝나면 결과를 제출할 수 있어요.</div>
    <div class="tasklist">
      ${DATA.map(d=>`<button class="taskcard" onclick="startTask('${d.id}')">
        <img src="${IMG(d.id)}" onerror="this.style.opacity=.15" alt="">
        <div class="tt"><b>도면 ${esc(d.id)}</b><div class="sub">${esc(d.name)}</div>
        <div class="sub" style="font-size:11px">해독 ${(d.quiz||[]).length} · 치수 ${(d.dims||[]).length}</div></div>
      </button>`).join("")}
    </div>
  </div>`;
}
function startTask(id){
  const d=DATA.find(x=>x.id===id); if(!d){go('task');return;}
  /* 치수 문제를 먼저 낸다 — 해독 퀴즈의 보기·발문에 치수 값이 들어 있어
     퀴즈를 먼저 풀면 뒤따르는 치수 문제의 답이 새기 때문이다. */
  const items=[]
    .concat((d.dims||[]).map(q=>({kind:'dim',data:q})))
    .concat((d.quiz||[]).map(q=>({kind:'quiz',data:q})));
  if(!items.length){toast("이 도면엔 등록된 문제가 없어요");return;}
  pState={id:id,name:d.name,items,i:0,correct:0,answered:false,hinted:false,hintUsed:0,start:Date.now()};
  bumpTry("도면"+id);
  drawTask();
}
function drawTask(){
  const s=pState, it=s.items[s.i], q=it.data;
  const head=header(`도면 ${s.id} 과제`,`${s.name} · ${it.kind==='quiz'?'해독':'치수'} 문제`);
  const foot=`
    <div class="feedback" id="fb"></div>
    <div class="row" style="margin-top:14px">
      <span class="pill">${s.i+1} / ${s.items.length}</span>
      <span class="pill">맞힘 ${s.correct}</span>
      <div class="spacer"></div>
      <button class="btn amber" id="nextb" style="display:none" onclick="nextTask()">${s.i+1>=s.items.length?"결과 보기 →":"다음 →"}</button>
    </div>
    <div class="progress"><i style="width:${(s.i)/s.items.length*100}%"></i></div>`;
  const imgbox=`<div class="imgbox" onclick="openLB('${IMG(s.id)}','${esc(s.id+" "+s.name)}')">
      <img src="${IMG(s.id)}" alt="도면 ${s.id}"><span class="zoomhint">🔍 눌러서 확대</span></div>`;
  if(it.kind==='quiz'){
    app.innerHTML=head+`<div class="panel">${imgbox}
      <div class="q">${esc(q.q)}</div>
      <div class="choices" id="choices">
        ${choiceOrder(q).map(i=>`<button class="choice" data-i="${i}" onclick="answerTaskQuiz(${i})">${esc(q.choices[i])}</button>`).join("")}
      </div>${foot}</div>`;
  }else{
    app.innerHTML=head+`<div class="panel">${imgbox}
      ${dimInputHTML(q,"task")}${foot}</div>`;
    setTimeout(()=>$("numin")&&$("numin").focus(),50);
  }
}
function answerTaskQuiz(i){
  const s=pState; if(s.answered)return; s.answered=true;
  const q=s.items[s.i].data, ok=i===q.answer; if(ok)s.correct++;
  document.querySelectorAll("#choices .choice").forEach(b=>{
    const bi=+b.dataset.i;
    if(bi===q.answer)b.classList.add("correct"); else if(bi===i)b.classList.add("wrong"); else b.classList.add("dim");
    b.style.pointerEvents="none";
  });
  const fb=$("fb");fb.className="feedback show "+(ok?"ok":"no");
  fb.innerHTML=(ok?"✅ 정답! ":"❌ 오답. 정답: <b>"+esc(q.choices[q.answer])+"</b><br>")+esc(q.explain||"");
  $("nextb").style.display="";
}
function taskHint(){const s=pState; if(s.answered)return; if(!s.hinted){s.hinted=true;s.hintUsed=(s.hintUsed||0)+1;} dimShowHint(s.items[s.i].data);}
function taskCheck(){
  const s=pState; if(s.answered)return;
  const v=parseFloat($("numin").value);
  if(isNaN(v)){toast("숫자를 먼저 입력하세요");return;}
  s.answered=true;
  if(dimGrade(s.items[s.i].data,v,false))s.correct++;
}
function taskGiveUp(){
  const s=pState; if(s.answered)return;
  s.answered=true; dimGrade(s.items[s.i].data,null,true);
}
function nextTask(){
  const s=pState; s.i++; s.answered=false; s.hinted=false;
  if(s.i>=s.items.length){finishTask();return;}
  drawTask();
}
function finishTask(){
  const s=pState, total=s.items.length, correct=s.correct;
  const pct=Math.round(correct/total*100);
  const dur=Math.round((Date.now()-s.start)/1000);
  const mm=String(Math.floor(dur/60)).padStart(2,"0"), ss=String(dur%60).padStart(2,"0");
  const msg=pct>=90?"완벽해요! 🏆":pct>=70?"잘했어요! 👍":pct>=50?"조금만 더! 💪":"복습이 필요해요 📚";
  const rp=awardRP(pct, "도면"+s.id);
  const submitBtn=rcReady()
    ? `<button class="btn amber" onclick="openSubmit('도면${s.id}',${correct},${total},${dur})">📤 이 과제 제출</button>`
    : "";
  app.innerHTML=header(`도면 ${s.id} 과제`,`${s.name} · 결과`)+`
  <div class="panel" style="text-align:center">
    <div style="font-size:20px;font-weight:800;margin:6px 0 2px">${msg}</div>
    <div class="statgrid">
      <div><div class="n" style="color:var(--amber)">${pct}%</div><div class="l">정답률</div></div>
      <div><div class="n" style="color:var(--cyan)">${correct}/${total}</div><div class="l">맞힌 개수</div></div>
      <div><div class="n">${mm}:${ss}</div><div class="l">걸린 시간</div></div>
    </div>
    ${rpBox(rp)}
    <div class="row" style="justify-content:center">
      ${submitBtn}
      <button class="btn cyan" onclick="startTask('${s.id}')">다시 풀기</button>
      <button class="btn" onclick="go('task')">다른 도면</button>
    </div>
    ${rcReady()?`<div class="sub" style="margin-top:12px;font-size:12px">제출 시트 탭: <b>${esc(RC_BASE)} · 도면${esc(s.id)}</b><br>🧑‍🏫 활동·성취·반복·계급 기반 <b>생기부(세특) 키워드</b>가 자동으로 함께 기록돼요.</div>`
               :`<div class="sub" style="margin-top:12px;font-size:12px">※ 선생님이 나눠준 <b>제출용 링크</b>로 열면 ‘제출’ 버튼이 나타나요.</div>`}
  </div>`;
}

function renderEditor(){
  app.innerHTML=header("문제 편집 · 도면 관리","선생님용")+`
  <div class="panel">
    <div class="row">

    <div class="hr"></div>

function doReset(){if(confirm("모든 편집 내용을 지우고 기본 문제집으로 되돌릴까요?")){resetData();DATA=loadData();toast("복원됨");go('edit');}}
function addDrawing(){
  const id=prompt("추가할 도면 번호/ID (예: 20). 이미지는 images/ID.png, images/iso/ID.png, images/views/ID.png 로 넣어주세요.");

  if(DATA.some(d=>d.id===id)){toast("이미 있는 ID");return;}
  DATA.push({id:id.trim(),name:"새 도면",note:"",quiz:[],dims:[]});
  saveData(DATA);go('editOne',id.trim());
}
function delDrawing(id){if(confirm(`도면 ${id} 을(를) 삭제할까요?`)){DATA=DATA.filter(d=>d.id!==id);saveData(DATA);toast("삭제됨");go('edit');}}

function renderEditOne(id){
  const d=DATA.find(x=>x.id===id); if(!d){go('edit');return;}
  app.innerHTML=header(`도면 ${d.id} 편집`,d.name)+`
  <div class="panel">
    <div class="imgbox" style="cursor:zoom-in" onclick="openLB('${IMG(d.id)}','${esc(d.id)}')">
      <img src="${IMG(d.id)}" onerror="this.parentElement.innerHTML='<div class=sub style=padding:20px>이미지 없음: images/${d.id}.png</div>'"><span class="zoomhint">🔍 확대</span>
    </div>
    <label>부품 이름</label><input type="text" id="f_name" value="${esc(d.name)}">
    <label>주서(주기) — 예: 지시없는 모따기 C2</label><input type="text" id="f_note" value="${esc(d.note||"")}">

    <div class="hr"></div>
    <div class="row"><b class="tag">① 해독 퀴즈(4지선다)</b><div class="spacer"></div>
      <button class="btn" onclick="addQ('${d.id}')">＋ 문항 추가</button></div>
    <div id="quizedit">${(d.quiz||[]).map((q,i)=>quizEditHTML(q,i)).join("")}</div>

    <div class="hr"></div>
    <div class="row"><b class="tag">③ 치수 찾기(숫자 입력)</b><div class="spacer"></div>
      <button class="btn" onclick="addD('${d.id}')">＋ 문항 추가</button></div>
    <div id="dimedit">${(d.dims||[]).map((q,i)=>dimEditHTML(q,i)).join("")}</div>

    <div class="hr"></div>
    <div class="row">
      <button class="btn cyan" onclick="saveOne('${d.id}')">💾 저장</button>
      <button class="btn ghost" onclick="go('edit')">취소</button>
    </div>
  </div>`;
}
function quizEditHTML(q,i){
  return `<div class="qedit" data-qi="${i}">
    <div class="row"><span class="tag">문항 ${i+1}</span><div class="spacer"></div>
      <button class="link" onclick="rmQ(${i})" style="color:var(--red)">삭제</button></div>
    <label>질문</label><textarea class="q_q">${esc(q.q)}</textarea>
    <label>보기 (정답 라디오를 선택)</label>
    ${[0,1,2,3].map(k=>`<div class="row" style="margin-top:4px">
      <input type="radio" name="ans_${i}" class="q_ans" value="${k}" ${q.answer===k?"checked":""}>
      <input type="text" class="q_c" value="${esc((q.choices||[])[k]||"")}" style="flex:1">
    </div>`).join("")}
    <label>해설</label><textarea class="q_ex">${esc(q.explain||"")}</textarea>
  </div>`;
}
function dimEditHTML(q,i){
  return `<div class="qedit" data-di="${i}">
    <div class="row"><span class="tag">치수 ${i+1}</span><div class="spacer"></div>
      <button class="link" onclick="rmD(${i})" style="color:var(--red)">삭제</button></div>
    <label>질문 (예: 밑판 전체 폭은?)</label><textarea class="d_ask">${esc(q.ask)}</textarea>
    <div class="row">
      <div style="flex:1"><label>정답(숫자)</label><input type="text" class="d_ans" value="${esc(q.answer)}"></div>
      <div style="width:90px"><label>단위</label><input type="text" class="d_unit" value="${esc(q.unit||"mm")}"></div>
      <div style="width:110px"><label>허용 오차 ±</label><input type="text" class="d_tol" value="${q.tol!=null?esc(q.tol):""}" placeholder="예: 0.01"></div>
    </div>
    <label style="display:flex;align-items:center;gap:6px">
      <input type="checkbox" class="d_calc" ${q.calc?"checked":""}> 🧮 계산해서 구하는 문항 (도면에 그대로 적혀 있지 않음)</label>
    <label>힌트 — <b>숫자를 적지 말 것</b>. 어디를 보라고만 안내 (예: 평면도 맨 위 가로 치수)</label>
    <textarea class="d_hint">${esc(q.hint||"")}</textarea>
    <label>정답 근거 — 채점한 뒤에 보여 줄 설명 (예: H7 앞 숫자가 기본 지름)</label>
    <textarea class="d_why">${esc(q.why||"")}</textarea>
  </div>`;
}
function addQ(id){const d=DATA.find(x=>x.id===id);d.quiz=d.quiz||[];d.quiz.push({q:"",choices:["","","",""],answer:0,explain:""});saveData(DATA);go('editOne',id);}
function addD(id){const d=DATA.find(x=>x.id===id);d.dims=d.dims||[];d.dims.push({ask:"",answer:0,unit:"mm",hint:"",why:""});saveData(DATA);go('editOne',id);}
function rmQ(i){const id=curEditId();const d=DATA.find(x=>x.id===id);collectOne(d);d.quiz.splice(i,1);saveData(DATA);go('editOne',id);}
function rmD(i){const id=curEditId();const d=DATA.find(x=>x.id===id);collectOne(d);d.dims.splice(i,1);saveData(DATA);go('editOne',id);}
function curEditId(){return document.querySelector("h1").textContent.replace(/[^0-9A-Za-z]/g,"").replace("편집","");}
function collectOne(d){
  d.name=$("f_name").value.trim();
  d.note=$("f_note").value.trim();
  d.quiz=[...document.querySelectorAll("#quizedit .qedit")].map(el=>{
    const i=el.dataset.qi;
    return {
      q:el.querySelector(".q_q").value.trim(),
      choices:[...el.querySelectorAll(".q_c")].map(x=>x.value.trim()),
      answer:+ (el.querySelector('input[name="ans_'+i+'"]:checked')||{value:0}).value,
      explain:el.querySelector(".q_ex").value.trim(),
    };
  });
  d.dims=[...document.querySelectorAll("#dimedit .qedit")].map(el=>({
    ask:el.querySelector(".d_ask").value.trim(),
    answer:parseFloat(el.querySelector(".d_ans").value)||0,
    unit:el.querySelector(".d_unit").value.trim()||"mm",
    hint:el.querySelector(".d_hint").value.trim(),
    why:(el.querySelector(".d_why")||{value:""}).value.trim(),
    calc:!!(el.querySelector(".d_calc")||{}).checked,
    tol:(function(){const t=(el.querySelector(".d_tol")||{value:""}).value.trim();
                    return t===""?undefined:(parseFloat(t)||undefined);})(),
  }));
}
function saveOne(id){const d=DATA.find(x=>x.id===id);collectOne(d);saveData(DATA);toast("저장됨");go('edit');}

/* export / import */
function exportJSON(){
  const body="/* 자동화설비 실기 공개도면 문제 데이터 — "+new Date().toISOString().slice(0,10)+" */\n"+
    "window.DEFAULT_DRAWINGS = "+JSON.stringify(DATA,null,2)+";\n";
  const blob=new Blob([body],{type:"application/javascript"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="data.js";a.click();
  toast("data.js 내보냄");
}
function importJSON(ev){
  const f=ev.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      let txt=r.result;
      const m=txt.match(/DEFAULT_DRAWINGS\s*=\s*(\[[\s\S]*\])\s*;?/);
      const arr=JSON.parse(m?m[1]:txt);
      if(!Array.isArray(arr))throw 0;
      DATA=arr;saveData(DATA);toast("불러옴");go('edit');
    }catch(e){alert("불러오기 실패: JSON 형식을 확인하세요.");}
  };
  r.readAsText(f);
}

go('home');

/* lesson.js 가 window.LESSON 을 미리 선언해 둔다 */
var DECK = window.LESSON || [];
var i = 0;        // 현재 슬라이드
var shown = false; // 확인 문제의 정답이 공개됐는지

function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

/* 목차 — 섹션이 바뀌는 첫 슬라이드만 넣어 한 번에 건너뛸 수 있게 한다 */
(function buildJump(){
  var sel = document.getElementById('jump'), last = null, html = '';
  DECK.forEach(function(s,k){
    if(s.s !== last){ html += '<option value="'+k+'">'+esc(s.s)+'</option>'; last = s.s; }
  });
  sel.innerHTML = html;
  sel.onchange = function(){ go(+sel.value); };
})();

function pts(list, solo){
  if(!list || !list.length) return '';
  return '<ul class="pts'+(solo?' solo':'')+'">'
       + list.map(function(p){ return '<li>'+p+'</li>'; }).join('') + '</ul>';
}
function figure(s){
  return '<div><div class="fig"><img src="'+s.img+'" alt=""></div>'
       + (s.cap ? '<p class="cap">'+esc(s.cap)+'</p>' : '') + '</div>';
}

function render(){
  var s = DECK[i]; if(!s) return;
  document.getElementById('sect').textContent = s.s || '';
  document.getElementById('pos').textContent = (i+1) + ' / ' + DECK.length;
  document.getElementById('barfill').style.width = ((i+1)/DECK.length*100) + '%';
  var sel = document.getElementById('jump');
  for(var k=i; k>=0; k--){ if(sel.querySelector('option[value="'+k+'"]')){ sel.value = k; break; } }

  var h = '';
  if(s.kind === 'quiz'){
    h += '<p class="lead">확인 문제</p>';
    h += '<h2 class="qhead">'+s.q+'</h2>';
    h += '<ul class="opts'+(shown?' done':'')+'" id="opts">'
       + s.o.map(function(o,k){
           return '<li'+(shown && k===s.a ? ' class="on"' : '')+' data-k="'+k+'" onclick="SlideDeck.reveal()">'+esc(o)+'</li>';
         }).join('') + '</ul>';
    if(shown && s.e) h += '<div class="exp">💡 '+s.e+'</div>';
  }else if(s.kind === 'title'){
    h += (s.lead ? '<p class="lead">'+esc(s.lead)+'</p>' : '') + '<h2>'+esc(s.t)+'</h2>' + pts(s.pts, true);
  }else if(s.kind === 'symbol'){
    h += '<h2>'+esc(s.t)+'</h2><div class="syms">'
       + s.sym.map(function(x){ return '<div class="sym"><div class="k">'+esc(x.k)+'</div><div class="d">'+x.d+'</div></div>'; }).join('')
       + '</div>' + pts(s.pts);
  }else if(s.kind === 'check'){
    h += '<h2>'+esc(s.t)+'</h2><ol class="check">'
       + s.items.map(function(x){ return '<li><span>'+x+'</span></li>'; }).join('') + '</ol>';
  }else{ /* concept */
    h += '<h2>'+esc(s.t)+'</h2>';
    h += s.img ? '<div class="two">'+figure(s)+pts(s.pts)+'</div>' : pts(s.pts, true);
  }
  document.getElementById('slide').innerHTML = h;

  document.getElementById('prev').disabled = (i === 0 && !shown);
  document.getElementById('next').textContent =
    (s.kind === 'quiz' && !shown) ? '정답 보기 ▶'
    : (i === DECK.length-1 ? '수업 마치기' : '다음 ▶');
}

function reveal(){ if(DECK[i].kind === 'quiz' && !shown){ shown = true; render(); } }
function next(){
  var s = DECK[i];
  if(s.kind === 'quiz' && !shown){ reveal(); return; }
  if(i >= DECK.length-1){ close(); return; }   /* 예전에는 index.html 로 나갔다 — 이제 층을 닫는다 */
  go(i+1);
}
function prev(){
  if(shown){ shown = false; render(); return; }
  if(i > 0) go(i-1);
}
function go(k){ i = Math.max(0, Math.min(DECK.length-1, k)); shown = false; render(); }

/* 아래 이동 바의 실제 높이를 알려 준다 (backbar 단추를 그 위로 올리기 위해) */
function syncNavHeight(){
  var n = document.querySelector('.nav');
  if(n) document.documentElement.style.setProperty('--navh', n.offsetHeight + 'px');
}
window.addEventListener('resize', syncNavHeight);

document.addEventListener('keydown', function(e){
  /* 이 슬라이드는 index 안의 한 층이 됐다 — 열려 있을 때만 단축키를 듣는다 */
  if(!document.body.classList.contains('bd33-open')) return;
  if(e.target.tagName === 'SELECT') return;
  if(e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown'){ e.preventDefault(); next(); }
  else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); prev(); }
  else if(e.key === 'Home'){ e.preventDefault(); go(0); }
  else if(e.key === 'End'){ e.preventDefault(); go(DECK.length-1); }
});

/* 열 때마다 첫 장부터 시작한다.
   예전에는 board.html 이 따로 열리는 페이지라 늘 1장부터였다 — 그 느낌을 그대로 둔다. */
function open(){
  var el = document.getElementById('boardwrap');
  el.classList.remove('hide');
  document.body.classList.add('bd33-open');
  go(0);
  syncNavHeight();
}
function close(){
  document.getElementById('boardwrap').classList.add('hide');
  document.body.classList.remove('bd33-open');
}
window.SlideDeck = { open: open, close: close, next: next, prev: prev, reveal: reveal, go: go };

})();
</script>
</body>
</html>
